<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>MOZABITE – Learn & Connect (LinguaFlow)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4338ca">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #f6f6fb;
      --sf: #ffffff;
      --tx: #1d1b3a;
      --mu: #6b6890;
      --bd: #e3e2f1;
      --pr: #4338ca;
      --pr2: #e8e6fb;
      --tq: #0d9488;
      --ok: #16a34a;
      --or: #ea580c;
      --c-ar: #4338ca;
      --c-fr: #0d9488;
      --c-en: #b45309;
      --c-mz: #be185d;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #12111f;
        --sf: #1c1a31;
        --tx: #edebff;
        --mu: #a09cc8;
        --bd: #2f2c4d;
        --pr: #8b83f5;
        --pr2: #2a2750;
        --tq: #2dd4bf;
        --c-ar: #9b94ff;
        --c-fr: #2dd4bf;
        --c-en: #f5b25b;
        --c-mz: #f472b6;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #12111f;
      --sf: #1c1a31;
      --tx: #edebff;
      --mu: #a09cc8;
      --bd: #2f2c4d;
      --pr: #8b83f5;
      --pr2: #2a2750;
      --tq: #2dd4bf;
      --c-ar: #9b94ff;
      --c-fr: #2dd4bf;
      --c-en: #f5b25b;
      --c-mz: #f472b6;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 400 16px/1.55 "Readex Pro", system-ui, sans-serif;
    }

    button, input, select, textarea { font: inherit; color: inherit; }

    #app {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }

    nav {
      background: var(--sf);
      border-inline-end: 1px solid var(--bd);
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .logo {
      font-weight: 700;
      font-size: 20px;
      padding: 4px 12px 18px;
      color: var(--pr);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nb {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 0;
      background: none;
      border-radius: 12px;
      cursor: pointer;
      text-align: start;
      min-height: 44px;
      color: var(--mu);
    }

    .nb.on {
      background: var(--pr2);
      color: var(--pr);
      font-weight: 600;
    }

    .nb[disabled] { opacity: .5; cursor: default; }
    .nb small { margin-inline-start: auto; font-size: 11px; }

    svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none;
    }

    main {
      padding: 28px clamp(16px, 4vw, 44px);
      max-width: 980px;
      width: 100%;
    }

    h1 { font-size: 26px; margin: 0 0 12px; font-weight: 700; }
    h2 { font-size: 18px; margin: 24px 0 12px; font-weight: 600; }

    .card {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(40, 30, 120, .06);
    }

    .msg {
      font-size: 20px;
      line-height: 1.5;
      margin: 8px 0 22px;
      max-width: 35ch;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .st b { display: block; font-size: 28px; font-weight: 700; }
    .st span { color: var(--mu); font-size: 13px; }

    .lane {
      display: grid;
      grid-template-columns: 120px 1fr 40px;
      align-items: center;
      gap: 12px;
      margin: 10px 0;
    }

    .bar {
      height: 10px;
      border-radius: 99px;
      background: var(--pr2);
      overflow: hidden;
    }

    .bar i { display: block; height: 100%; border-radius: 99px; }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      min-height: 44px;
      cursor: pointer;
      background: var(--pr);
      color: #fff;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn.g { background: var(--pr2); color: var(--pr); }
    .btn.d { background: var(--or); color: #fff; }
    .btn.sm { padding: 8px 14px; min-height: 36px; font-size: 13px; border-radius: 10px; }

    .btn:focus-visible, .nb:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--tq);
      outline-offset: 2px;
    }

    .bar2 {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 14px 0;
    }

    .bar2 input, .bar2 select, .f input, .f select, .f textarea {
      border: 1px solid var(--bd);
      background: var(--sf);
      border-radius: 10px;
      padding: 10px 12px;
      min-height: 44px;
      width: 100%;
    }

    .bar2 input { flex: 1 1 220px; width: auto; }
    .bar2 select { width: auto; }

    .it { margin-bottom: 12px; }
    .it .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 10px;
    }

    .tr {
      display: flex;
      gap: 10px;
      align-items: baseline;
      padding: 6px 0;
      border-bottom: 1px dashed var(--bd);
      unicode-bidi: isolate;
    }

    .tr:last-of-type { border: 0; }
    .tr .ln { font-size: 12px; font-weight: 600; min-width: 80px; flex: none; }
    .tr .tx { font-size: 17px; unicode-bidi: isolate; overflow-wrap: anywhere; }
    .tr .pn { font-size: 13px; color: var(--mu); unicode-bidi: isolate; }

    .chip {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 99px;
      background: var(--pr2);
      color: var(--pr);
      font-weight: 500;
    }

    .chip.w { background: #ffedd5; color: #9a3412; }
    .empty { text-align: center; padding: 48px 16px; }
    .empty h2 { margin-top: 0; }

    dialog {
      border: 0;
      border-radius: 18px;
      padding: 0;
      width: min(640px, 94vw);
      max-height: 92vh;
      background: var(--sf);
      color: var(--tx);
    }

    dialog::backdrop { background: rgba(10, 8, 40, .5); }
    .dl { padding: 20px; display: flex; flex-direction: column; gap: 12px; }

    .f label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .f { display: block; }
    .lb { border: 1px solid var(--bd); border-radius: 14px; padding: 12px; }
    .lb details { margin-top: 6px; }
    .lb summary { cursor: pointer; color: var(--mu); font-size: 13px; }

    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .err { color: var(--or); font-size: 14px; min-height: 20px; }
    .hint { color: var(--mu); font-size: 13px; }
    textarea { resize: vertical; }

    .banner {
      background: #ffedd5;
      color: #9a3412;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .top-streak-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--sf);
      border: 1px solid var(--bd);
      padding: 12px 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 1px 3px rgba(40, 30, 120, .04);
    }

    .streak-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--or);
      font-size: 16px;
    }

    .streak-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .day-banner { border-top: 4px solid var(--pr); margin-bottom: 20px; }

    .day-status-pill {
      background: #dcfce7;
      color: #15803d;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .quiz-card {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 24px;
      margin-top: 16px;
    }

    .quiz-q-title {
      font-size: 22px;
      font-weight: 700;
      margin: 16px 0;
      color: var(--pr);
    }

    @media (max-width: 859px) {
      #app { display: block; }
      main { padding-bottom: 96px; }
      nav {
        position: fixed;
        inset: auto 0 0 0;
        height: auto;
        flex-direction: row;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
        border-inline-end: 0;
        border-top: 1px solid var(--bd);
        z-index: 5;
      }
      .logo, .nb small { display: none; }
      .nb {
        flex: 1;
        flex-direction: column;
        gap: 2px;
        font-size: 11px;
        padding: 6px 2px;
        justify-content: center;
        text-align: center;
      }
      .fab { inset-block-end: 84px; }
      .two { grid-template-columns: 1fr; }
    }

    .fab {
      position: fixed;
      inset-inline-end: 18px;
      inset-block-end: 24px;
      z-index: 4;
      box-shadow: 0 6px 18px rgba(67, 56, 202, .35);
      border-radius: 99px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .bar i { transition: width .5s; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <dialog id="dlg"></dialog>

  <script>
    const LG=['ar','fr','en','mz'], DIR={ar:'rtl',fr:'ltr',en:'ltr',mz:'ltr'}, IX={ar:0,fr:1,en:2};
    const NM={
      ar:{ar:'العربية',fr:'الفرنسية',en:'الإنجليزية',mz:'المزابية Tumẓabt'},
      fr:{ar:'Arabe',fr:'Français',en:'Anglais',mz:'Mozabite Tumẓabt'},
      en:{ar:'Arabic',fr:'French',en:'English',mz:'Mozabite Tumẓabt'}
    };

    const D={
      dash:['الرئيسية','Accueil','Home'],
      vocab:['مفرداتي','Mon vocabulaire','My vocabulary'],
      quiz:['اختبر نفسك','Quiz','Quiz'],
      stats:['إحصائياتي','Statistiques','Stats'],
      set:['الإعدادات','Réglages','Settings'],
      soon:['قريبًا','Bientôt','Soon'],
      add:['إضافة كلمة أو جملة','Ajouter un mot ou une phrase','Add a word or phrase'],
      q:['ابحث في النصوص والترجمات','Rechercher dans les textes et traductions','Search texts and translations'],
      all:['الكل','Tous','All'],
      inc:['ترجمات ناقصة','Traductions manquantes','Missing translations'],
      words:['كلمات','Mots','Words'],
      phr:['جمل وتعابير','Phrases et expressions','Phrases & expressions'],
      done:['متقنة','Maîtrisés','Mastered'],
      rev:['تحتاج مراجعة','À revoir','Needs review'],
      today:['أُضيفت اليوم','Ajoutés aujourd’hui','Added today'],
      lanes:['حضور كل لغة في مفرداتك','Présence de chaque langue','Each language in your vocabulary'],
      et:['ابدأ بأول كلمة','Commencez par un premier mot','Start with your first word'],
      ed:['احفظ كلمة بلغة واحدة، وأضف باقي الترجمات متى شئت.','Enregistrez un mot dans une langue, ajoutez les autres traductions plus tard.','Save a word in one language and add the other translations whenever you like.'],
      m0:['خطوة صغيرة اليوم، وطلاقة أكبر غدًا.','Un petit pas aujourd’hui, plus d’aisance demain.','A small step today, more fluency tomorrow.'],
      m1:['راجع ما تعلمته، فالتكرار يصنع الفرق.','Révisez ce que vous savez : la répétition fait la différence.','Review what you know: repetition makes the difference.'],
      m2:['كل كلمة تتعلمها اليوم تقرّبك من هدفك.','Chaque mot appris vous rapproche de votre but.','Every word you learn brings you closer to your goal.'],
      save:['حفظ','Enregistrer','Save'],
      cancel:['إلغاء','Annuler','Cancel'],
      del:['حذف','Supprimer','Delete'],
      sure:['تأكيد الحذف النهائي','Confirmer la suppression','Confirm delete'],
      edit:['تعديل','Modifier','Edit'],
      type:['النوع','Type','Type'],
      t:[['كلمة','جملة','تعبير'],['Mot','Phrase','Expression'],['Word','Sentence','Expression']],
      src:['اللغة الأصلية','Langue d’origine','Source language'],
      pron:['النطق / الكتابة الصوتية','Prononciation','Pronunciation'],
      alt:['كتابات بديلة (افصل بفاصلة)','Graphies alternatives (virgule)','Alternative spellings (comma)'],
      dirl:['اتجاه الكتابة','Sens d’écriture','Writing direction'],
      notes:['ملاحظات','Notes','Notes'],
      ex:['مثال على الاستخدام','Exemple d’usage','Usage example'],
      cat:['التصنيف','Catégorie','Category'],
      diff:['الصعوبة','Difficulté','Difficulty'],
      d:[['سهل','متوسط','صعب'],['Facile','Moyen','Difficile'],['Easy','Medium','Hard']],
      stt:['الحالة','Statut','Status'],
      s:[['جديد','قيد التعلم','يحتاج مراجعة','متقن'],['Nouveau','En cours','À revoir','Maîtrisé'],['New','Learning','Needs review','Mastered']],
      mzh:['اكتبها بنفسك؛ لا يقترح التطبيق أي ترجمة مزابية.','Saisissez-la vous-même ; l’app ne suggère aucune traduction mozabite.','Enter it yourself; the app never suggests Mozabite translations.'],
      opt:['اختياري','facultatif','optional'],
      dup:['هذا العنصر موجود مسبقًا.','Cet élément existe déjà.','This item already exists.'],
      req:['اكتب النص في حقل اللغة الأصلية.','Saisissez le texte dans la langue d’origine.','Fill in the text of the source language.'],
      none:['لا نتائج مطابقة.','Aucun résultat.','No matching results.'],
      miss:['ناقص:','Manque :','Missing:'],
      ui:['لغة الواجهة','Langue de l’interface','Interface language'],
      th:['المظهر','Thème','Theme'],
      tt:[['تلقائي','فاتح','داكن'],['Auto','Clair','Sombre'],['Auto','Light','Dark']],
      bk:['النسخ الاحتياطي والاستيراد','Sauvegarde et import','Backup and import'],
      ex2:['تصدير (JSON): انسخ النص واحفظه في ملف','Export (JSON) : copiez et enregistrez dans un fichier','Export (JSON): copy and save to a file'],
      im:['استيراد: الصق JSON هنا','Import : collez le JSON ici','Import: paste JSON here'],
      ib:['استيراد','Importer','Import'],
      ok:['تم استيراد %a وتجاهل %b مكررًا أو غير صالح.','%a importés, %b ignorés (doublons ou invalides).','Imported %a, skipped %b duplicate or invalid.'],
      bad:['JSON غير صالح.','JSON invalide.','Invalid JSON.'],
      loc:['بياناتك محفوظة محليًا على هذا الجهاز فقط.','Vos données restent sur cet appareil.','Your data stays on this device only.'],
      nodb:['تعذّر التخزين الدائم في هذا المتصفح؛ ستُفقد البيانات عند الإغلاق.','Stockage persistant indisponible : les données seront perdues à la fermeture.','Persistent storage unavailable: data is lost on close.'],
      pend:['جميع البيانات والإحصائيات والنتائج تُحسب مباشرة وبشكل حقيقي من قاعدة البيانات.','Tous les chiffres et statistiques sont calculés en temps réel.','All stats and quizzes use real saved data.']
    };

    Object.assign(D,{
      tr:['ترجمة','Traduire','Translate'],
      trl:['جارٍ الترجمة…','Traduction…','Translating…'],
      tm:['ترجمة آلية — راجعها قبل الحفظ','Traduction automatique — à vérifier','Machine translation — review before saving'],
      mach:['آلية','Auto','Auto'],
      eoff:['لا يوجد اتصال بالإنترنت.','Pas de connexion Internet.','No Internet connection.'],
      euns:['الترجمة الآلية غير متاحة لهذه اللغة (المزابية بالإدخال اليدوي).','Traduction automatique indisponible pour cette langue (mozabite : saisie manuelle).','Machine translation isn’t available for this language (Mozabite is manual).'],
      elim:['تجاوزت حد الاستخدام، جرّب لاحقًا.','Limite d’utilisation atteinte, réessayez plus tard.','Usage limit reached, try again later.'],
      efail:['تعذّرت الترجمة، حاول مرة أخرى.','Échec de la traduction, réessayez.','Translation failed, try again.'],
      elong:['النص أطول من 500 حرف.','Texte de plus de 500 caractères.','Text longer than 500 characters.']
    });

    const S={items:[],completedDays:[],revisions:[],set:{ui:'ar',theme:'auto'},view:'dash',q:'',st:'',inc:false,conf:null,db:true,quizState:null};
    const t=k=>{const v=D[k][IX[S.set.ui]];return v},tt=(k,i)=>D[k][IX[S.set.ui]][i];
    const $=s=>document.querySelector(s);
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f\u064B-\u065F\u0670]/g,'').toLowerCase().trim();
    const ico={
      dash:'<path d="M3 11l9-8 9 8v10H15v-7H9v7H3z"/>',
      vocab:'<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/>',
      quiz:'<path d="M12 3l10 5-10 5L2 8zM6 11v5c3 3 9 3 12 0v-5"/>',
      stats:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
      set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
      plus:'<path d="M12 5v14M5 12h14"/>',
      flame:'<path d="M12 2c0 4-4 6-4 10a4 4 0 0 0 8 0c0-4-4-6-4-10z"/>'
    };
    const svg=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ico[n]}</svg>`;

    /* ---- Storage System (IndexedDB) ---- */
    const DB=new Promise(r=>{
      try{
        const q=indexedDB.open('linguaflow',2);
        q.onupgradeneeded=e=>{
          const d=q.result;
          if(!d.objectStoreNames.contains('items'))d.createObjectStore('items',{keyPath:'id'});
          if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'k'});
          if(!d.objectStoreNames.contains('completedDays'))d.createObjectStore('completedDays',{keyPath:'day'});
          if(!d.objectStoreNames.contains('revisions'))d.createObjectStore('revisions',{keyPath:'itemId'});
        };
        q.onsuccess=()=>r(q.result);
        q.onerror=()=>r(null);
      }catch(e){r(null);}
    });

    async function run(store,mode,fn){
      const d=await DB;if(!d){S.db=false;return null;}
      return new Promise(res=>{
        try{
          const x=d.transaction(store,mode),q=fn(x.objectStore(store));
          x.oncomplete=()=>res(q&&q.result);
          x.onerror=()=>{S.db=false;res(null);};
        }catch(e){S.db=false;res(null);}
      });
    }

    const saveItem=i=>run('items','readwrite',s=>s.put(i));
    const delItem=id=>run('items','readwrite',s=>s.delete(id));
    const saveSet=()=>run('settings','readwrite',s=>s.put({k:'s',v:S.set}));
    const saveCompletedDay=cd=>run('completedDays','readwrite',s=>s.put(cd));
    const saveRevision=rv=>run('revisions','readwrite',s=>s.put(rv));

    /* ---- Data Helpers & Real Streak Calculation ---- */
    const tr=(it,l)=>it.translations.find(x=>x.language===l&&x.text);
    const texts=it=>LG.map(l=>l===it.sourceLanguage?{language:l,text:it.sourceText}:tr(it,l)).filter(Boolean);
    const miss=it=>LG.filter(l=>l!==it.sourceLanguage&&!tr(it,l));
    const hay=it=>norm([it.sourceText,it.category,it.notes,...it.translations.flatMap(x=>[x.text,x.pronunciation,...(x.alternatives||[])])].join(' '));
    const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);

    function getRealStreak(){
      if(!S.completedDays || !S.completedDays.length) return { currentStreak: 0, longestStreak: 0 };
      const dates = [...new Set(S.completedDays.map(d => d.date))].sort();
      if(!dates.length) return { currentStreak: 0, longestStreak: 0 };
      
      let longest = 0, current = 0;
      let prevDate = null;
      const todayStr = new Date().toISOString().split('T')[0];
      const yesterdayDate = new Date(Date.now() - 86400000).toISOString().split('T')[0];

      for(let i=0; i<dates.length; i++){
        const currDate = dates[i];
        if(!prevDate) {
          current = 1;
        } else {
          const diff = (new Date(currDate) - new Date(prevDate)) / 86400000;
          if(diff === 1) current++;
          else if(diff > 1) current = 1;
        }
        if(current > longest) longest = current;
        prevDate = currDate;
      }

      const lastDate = dates[dates.length - 1];
      if(lastDate !== todayStr && lastDate !== yesterdayDate) {
        current = 0;
      }
      return { currentStreak: current, longestStreak: longest };
    }

    async function submit(){
      const f=$('#dlg .dl'),id=f.dataset.id,sl='ar';
      let src='',srcMeta,trs=[];
      f.querySelectorAll('.lb').forEach(b=>{
        const mc=b.dataset.machine==='1',l=b.dataset.l,text=b.querySelector('.tx').value.trim(),dir=b.querySelector('.dr')?.value||DIR[l],pr=b.querySelector('.pn').value.trim(),al=b.querySelector('.al').value.split(',').map(s=>s.trim()).filter(Boolean),meta={pronunciation:pr,alternatives:al,dir};
        if(l===sl){src=text;srcMeta=meta;}else if(text)trs.push({language:l,text,source:mc?'machine':'manual',verified:!mc,...meta});
      });
      const err=m=>$('#fer').textContent=m;
      if(!src)return err(t('req'));
      if(S.items.some(i=>i.id!==id&&i.sourceLanguage===sl&&norm(i.sourceText)===norm(src)))return err(t('dup'));

      const old=S.items.find(i=>i.id===id),now=Date.now(),ty=['word','sentence','expression'][+$('#ft').value];
      const dayNum = parseInt($('#fday').value) || getCurrentLearningDay();

      const it={id:id||uid(),type:ty,sourceLanguage:sl,sourceText:src,srcMeta,translations:trs,category:$('#fc').value.trim(),learningDay:dayNum,notes:$('#fn').value.trim(),status:$('#fz').value,createdAt:old?.createdAt||now,updatedAt:now};
      S.items=old?S.items.map(i=>i.id===id?it:i):[it,...S.items];
      await saveItem(it);
      $('#dlg').close();
      render();
    }

    /* ---- Quiz Engine Execution ---- */
    function startQuiz(){
      const scope = $('#qz-scope').value;
      const type = $('#qz-type').value;
      const countVal = $('#qz-count').value;

      let candidates = S.items.filter(i=>tr(i,'mz')?.text);
      if(scope === 'day'){
        const day = parseInt($('#qz-day-num').value);
        candidates = candidates.filter(i=>i.learningDay === day);
      } else if(scope === 'rev'){
        const dueIds = S.revisions.filter(r=>r.isDue).map(r=>r.itemId);
        candidates = candidates.filter(i=>dueIds.includes(i.id));
      }

      if(type === 'word') candidates = candidates.filter(i=>i.type === 'word');
      else if(type === 'sentence') candidates = candidates.filter(i=>i.type === 'sentence' || i.type === 'expression');

      if(!candidates.length){
        alert('لا توجد عناصر تطابق الفلاتر المحددة وتضم ترجمة ميزابية مؤكدة.');
        return;
      }

      candidates.sort(()=>0.5 - Math.random());
      const max = countVal === 'all' ? candidates.length : Math.min(parseInt(countVal), candidates.length);

      S.quizState = {
        questions: candidates.slice(0, max),
        currentIndex: 0,
        answers: [],
        finished: false
      };
      render();
    }

    async function submitQuizAnswer(){
      const userAns = $('#qz-user-input').value;
      const q = S.quizState.questions[S.quizState.currentIndex];
      const mzObj = tr(q, 'mz');
      const validAnswers = [mzObj.text, ...(mzObj.alternatives || [])].map(norm);

      const isCorrect = validAnswers.includes(norm(userAns));

      let rev = S.revisions.find(r=>r.itemId === q.id) || { itemId: q.id, incorrectCount: 0, intervalDays: 1, lastReviewed: null, isDue: false };
      if(!isCorrect) {
        rev.incorrectCount++;
        rev.intervalDays = 1;
        rev.isDue = true;
      } else {
        rev.intervalDays = rev.intervalDays ? rev.intervalDays * 2 : 2;
        rev.isDue = false;
      }
      rev.lastReviewed = new Date().toISOString();

      S.revisions = S.revisions.filter(r=>r.itemId !== q.id).concat(rev);
      await saveRevision(rev);

      S.quizState.answers.push({ item: q, userAns, correctAns: mzObj.text, isCorrect });

      if(S.quizState.currentIndex + 1 < S.quizState.questions.length) {
        S.quizState.currentIndex++;
      } else {
        S.quizState.finished = true;
      }
      render();
    }

    document.addEventListener('click', async e => {

      }

      else if(a==='sv') submit();
      else if(a==='open-stats') { S.view='stats'; render(); }
      else if(a==='open-quiz') { S.view='quiz'; S.quizState=null; render(); }
      else if(a==='open-rev') { S.view='quiz'; S.quizState=null; render(); }

        const day = parseInt(b.dataset.day);
        const todayStr = new Date().toISOString().split('T')[0];
        if(!S.completedDays.some(d=>d.day===day)){
          const record = { day, date: todayStr };
          S.completedDays.push(record);
          await saveCompletedDay(record);
          render();
        }
      }
      else if(a==='start-quiz') startQuiz();
      else if(a==='submit-qz-ans') submitQuizAnswer();
      else if(a==='reset-quiz') { S.quizState = null; render(); }
      else if(a==='del'){
        S.items=S.items.filter(i=>i.id!==id); S.conf=null; await delItem(id); render();
      }
      else if(a==='cd'){ S.conf=id; render(); }
      else if(a==='nc'){ S.conf=null; render(); }
    });

    document.addEventListener('change', async e => {
      if(e.target.id === 'qz-scope'){
        const daySelect = $('#qz-day-select');
        if(daySelect) daySelect.style.display = e.target.value === 'day' ? 'block' : 'none';
      } else if(e.target.id === 'ui'){
        S.set.ui = e.target.value;
        await saveSet();
        render();
      } else if(e.target.id === 'th'){
        S.set.theme = e.target.value;
        await saveSet();
        render();
      }
    });

    /* ---- App Initialization ---- */
    (async()=>{
      const s=await run('settings','readonly',x=>x.get('s')); if(s&&s.v) Object.assign(S.set,s.v);
      const allItems=await run('items','readonly',x=>x.getAll()); if(allItems) S.items=allItems;
      const allComp=await run('completedDays','readonly',x=>x.getAll()); if(allComp) S.completedDays=allComp;
      const allRev=await run('revisions','readonly',x=>x.getAll()); if(allRev) S.revisions=allRev;

      const h=location.hash.slice(1);
      if(['dash','vocab','quiz','stats','set'].includes(h)) S.view=h;
      render();
    })();

    if('serviceWorker' in navigator && location.protocol.startsWith('http')){
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }
  </script>
</body>
</html>
